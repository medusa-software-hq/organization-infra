version: '3'

env:
  # No secrets yet; to be replaced by a KMS key
  PULUMI_CONFIG_PASSPHRASE: ""

tasks:
  install:
    desc: Install dependencies
    run: once
    sources:
      - package.json
      - yarn.lock
    generates:
      - .yarn/install-state.gz
    cmds:
      - corepack yarn install --immutable

  typecheck:
    desc: Type check the package
    deps: [install]
    cmds:
      - corepack yarn tsc --noEmit

  fixFormatting:
    desc: Fix package formatting
    deps: [install]
    cmds:
      - corepack yarn oxfmt --write "**/*.ts"

  lint:
    desc: Lint the package
    deps: [install]
    cmds:
      - corepack yarn oxlint --type-aware

  fixLint:
    desc: Fix lint issues in the package
    deps: [install]
    cmds:
      - corepack yarn oxlint --type-aware --fix

  selectStack:
    internal: true
    run: once
    cmds:
      - pulumi stack select --non-interactive main

  infraApply:
    desc: Apply changes to the stack
    deps: [install, selectStack]
    interactive: true
    cmds:
      - pulumi up

  infraPreview:
    desc: Preview changes to the stack
    deps: [install, selectStack]
    cmds:
      - pulumi preview --non-interactive
