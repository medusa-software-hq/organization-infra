version: '3'

tasks:
  install:
    desc: Install dependencies
    run: once
    sources:
      - package.json
      - yarn.lock
    generates:
      - .yarn/install-state.gz
    cmds:
      - corepack yarn install --immutable

  typecheck:
    desc: Type check the package
    deps: [install]
    cmds:
      - corepack yarn tsc --noEmit

  fixFormatting:
    desc: Fix package formatting
    deps: [install]
    cmds:
      - corepack yarn oxfmt --write "**/*.ts"

  lint:
    desc: Lint the package
    deps: [install]
    cmds:
      - corepack yarn oxlint --type-aware

  fixLint:
    desc: Fix lint issues in the package
    deps: [install]
    cmds:
      - corepack yarn oxlint --type-aware --fix

  infraApply:
    desc: Apply changes to the current stack
    deps: [install]
    interactive: true
    cmds:
      - pulumi up

  infraPreview:
    desc: Preview changes against the current stack
    deps: [install]
    interactive: true
    cmds:
      - pulumi preview
