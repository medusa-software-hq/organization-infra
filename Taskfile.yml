version: '3'

includes:
  github:
    taskfile: github.Taskfile.yml
    dir: .

  infra:
    taskfile: infra/Taskfile.yml
    dir: infra

  bootstrap:
    taskfile: infra/bootstrap/Taskfile.yml
    dir: infra/bootstrap

  foundation:
    taskfile: infra/foundation/Taskfile.yml
    dir: infra/foundation

tasks:
  fixAll:
    desc: Apply all automatic fixes
    deps:
      - github:fixLint
